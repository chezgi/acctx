notes_fa:
  - پارامترهای بودجه سنواتی ۱۳۹۷ تا ۱۴۰۵ باید پیش از ارسال یا دفاع با متن رسمی همان سال تطبیق داده شوند.
  - محاسبه حقوق فقط درآمد عادی مشمول نرخ پلکانی را پوشش می‌دهد؛ اقلام با نرخ خاص یا معافیت ویژه خارج از دامنه هستند.
  - تمدیدهای موقت مهلت و تعطیلات رسمی در محاسبه مهلت پایه اعمال نمی‌شوند.
